apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: expense-teams
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Git files generator, not a hand-maintained List -- replaces 4 literal
  # elements that had to be manually appended to this file for every new
  # service (originally pasted in by hand from idp-cli's generated
  # snippet). Now: idp-cli's publish-appset-mr CI job just adds one new
  # file under services/<team>/<name>.yaml and opens an MR against THIS
  # repo -- "new service" becomes "one new file", not "edit a shared list",
  # which was also the exact thing that made this file risky to patch with
  # a script in the first place (see the multi-document YAML corruption
  # note in CLAUDE.md/memory -- that risk doesn't exist for a brand new
  # file). goTemplate: true (already set above, for other reasons) is what
  # lets each file's flattened top-level keys reach the template below as
  # {{.name}}/{{.namespace}}/etc., unchanged from the old List generator.
  generators:
    - git:
        repoURL: https://gitlab.com/demo-org/gitops.git
        revision: main
        files:
          - path: "services/**/*.yaml"
  template:
    metadata:
      name: '{{.name}}'
    spec:
      project: '{{.project}}'
      sources:
        - repoURL: https://gitlab.com/demo-org/helm-charts.git
          targetRevision: v0.2.0
          path: charts/common-web-service
          helm:
            valueFiles:
              - $values/{{.valuesFile}}
        - repoURL: '{{.valuesRepoURL}}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      # Applied to all 4 elements, not just the 2 with an HPA (team-payments-backend/-frontend):
      # harmless no-op for the other 2 (nothing else mutates their spec.replicas, so there's
      # nothing to ever "ignore" there), and avoids the per-generator conditional template
      # override this file used to attempt — the ArgoCD API server rejected that as invalid
      # (a generator-level `template` must itself carry metadata/spec.project/spec.destination,
      # it doesn't partially merge the way an earlier version of this file assumed).
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
