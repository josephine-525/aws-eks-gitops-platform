apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-payments
  namespace: argocd
spec:
  description: team-payments's own Applications only
  sourceRepos:
    - https://gitlab.com/demo-org/helm-charts.git
    - https://gitlab.com/demo-org/expenseapp.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: team-payments
  clusterResourceWhitelist:
    # Needed for expense-teams.yaml's CreateNamespace=true syncOption -- Namespace
    # is cluster-scoped, without this the Application can't even create its own
    # namespace on first sync.
    - group: ""
      kind: Namespace
