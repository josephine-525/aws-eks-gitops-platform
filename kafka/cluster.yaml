# 3-node KRaft Kafka cluster (no ZooKeeper -- this Strimzi version doesn't
# support it at all, KafkaNodePool is mandatory), one node per AZ -- matches
# this cluster's 3 node groups (expense_default/apps/extra, one per AZ).
# Started as a single-node cluster (replicas: 1); redesigned 2026-10-01 once
# the user pointed out a single broker throws away the whole point of a
# 3-AZ layout -- replication.factor: 1 meant zero redundancy, any one node/AZ
# going down took the whole cluster down with it.
#
# Two layers to this, deliberately separate concerns:
#   1. Kubernetes scheduling (this object's topologySpreadConstraints below):
#      guarantees the 3 broker PODS actually land on 3 different AZs.
#      DoNotSchedule (not ScheduleAnyway, unlike team-payments-backend's) --
#      a soft constraint here would let all 3 pods land in the same AZ and
#      silently defeat the whole point. Combined with the gp3 StorageClass's
#      existing volumeBindingMode: WaitForFirstConsumer, each broker's EBS
#      volume automatically lands in the same AZ as its own pod -- no extra
#      config needed for that part, it's already what WaitForFirstConsumer
#      does.
#   2. Kafka's own replica placement (spec.kafka.rack below, on the Kafka
#      CR): tells Kafka which AZ each broker is actually in, so ITS OWN
#      partition-replica placement spreads replicas of the same partition
#      across AZs. Pods being spread across AZs (layer 1) does not by
#      itself guarantee this -- Kafka would otherwise assign replicas
#      without knowing AZ identity at all.
# Persistent storage on the gp3 StorageClass (terraform-modules/compute's
# aws_eks_addon "ebs_csi", v2.3.0+) -- verified live that a pod restart
# doesn't lose data before any of this was written down.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: expense-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    class: gp3
    deleteClaim: true
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: expense-kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: expense-kafka
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    # Rack awareness -- separate from the KafkaNodePool's topologySpreadConstraints
    # above (that controls where PODS get scheduled; this controls how KAFKA ITSELF
    # places partition REPLICAS once it knows each broker's AZ). Each broker detects
    # its own node's AZ at startup via this topologyKey and reports it as its
    # broker.rack; Kafka's replica-placement algorithm then spreads a partition's
    # replicas across different racks (AZs) instead of assigning them blind to AZ
    # identity.
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        # Strimzi's own generated NetworkPolicy only covers its internal
        # ports (9090/9091/8443) by default -- it does NOT open the client
        # listener to anything outside the kafka namespace unless told to.
        # Without this, team-payments/team-fraud-detection/team-analytics'
        # own allow-kafka-egress NetworkPolicy (gitops/network-policies/) is
        # only half the picture: confirmed live, producer connections hung
        # until both sides were in place.
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: team-payments
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: team-fraud-detection
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: team-analytics
    config:
      # replication.factor: 3 / min.insync.replicas: 2 is the standard production
      # pairing, not arbitrary numbers: a write only needs 2 of the 3 replicas to
      # ack, so losing any single AZ still leaves writes fully available (2 of 3
      # remain) -- only losing 2 AZs at once actually blocks writes. This is also
      # why 3 (not 2, not 4) is the right broker/controller count for this
      # cluster's 3-AZ layout: KRaft's Raft quorum needs a simple majority to keep
      # electing leaders and committing metadata, and 3 is the smallest odd number
      # that tolerates exactly 1 node/AZ failure while still having a majority (2/3).
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
