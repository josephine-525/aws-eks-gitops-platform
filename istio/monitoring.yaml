# Istio's sidecar injection already auto-annotates every mesh pod with
# prometheus.io/scrape=true, prometheus.io/port=15020, prometheus.io/path=
# /stats/prometheus (confirmed live 2026-10-02 on a throwaway test pod's own
# metadata.annotations) -- but kube-prometheus-stack's Prometheus Operator does NOT
# scrape plain annotations, only ServiceMonitor/PodMonitor CRDs. Without this file,
# none of the Envoy sidecar metrics (the same cx_connect_fail/rq_total counters used
# live today to debug the NetworkPolicy port mismatch) ever reach Prometheus at all.
#
# PodMonitor, not ServiceMonitor: there's no single stable Service fronting "every
# sidecar in the mesh" the way there is for istiod -- PodMonitor selects pods directly.
# namespaceSelector.any: true is required even though this object itself lives in
# istio-system -- PodMonitor's OWN namespace has no bearing on which namespaces its
# pod selector searches; without this, it would only ever match pods inside
# istio-system (none exist, injection is disabled there), not the actual mesh-enabled
# team namespaces.
#
# security.istio.io/tlsMode=istio is a label Istio's injector adds automatically to
# every pod it sidecars (confirmed live via `kubectl get pod ... --show-labels`) --
# using it instead of enumerating team-payments/team-fraud-detection/team-analytics by
# name means any future namespace that joins the mesh is picked up with zero changes
# here.
#
# release: kube-prometheus-stack label is REQUIRED, not optional -- found live: without
# it, this PodMonitor was silently invisible to Prometheus. The chart's
# podMonitorSelector is `matchLabels: {release: kube-prometheus-stack}` (checked via
# `kubectl get prometheus -n monitoring -o jsonpath='{.items[0].spec.podMonitorSelector}'`),
# not the permissive empty selector a vanilla kube-prometheus-stack install sometimes
# ships with. The existing nginx-exporter ServiceMonitor
# (team-payments/team-payments-frontend-common-web-service) carries this same label,
# which is why it already worked and this one initially didn't.
#
# port: http-envoy-prom (15090), not 15020 -- found live, second bug: PodMonitor's
# targetPort/portNumber fields require the port to be DECLARED on the container
# (`kubectl explain podmonitor.spec.podMetricsEndpoints` : "the Pod must declare the
# specified Port in its spec"). istio-proxy only declares one container port,
# confirmed via `kubectl get pod ... -o jsonpath='{.spec.initContainers[*].ports}'`:
# `{"containerPort":15090,"name":"http-envoy-prom"}`. Port 15020 (used in the
# auto-injected prometheus.io/port annotation) is pilot-agent's health/status port, not
# Envoy's own metrics port, and isn't a declared container port at all -- a PodMonitor
# referencing it matches zero endpoints and is silently absent from Prometheus's
# target list (no error, just never shows up). 15090 is Envoy's dedicated Prometheus
# port by Istio's own convention, and /stats/prometheus is the correct path there too.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-mesh-sidecars
  namespace: istio-system
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      security.istio.io/tlsMode: istio
  podMetricsEndpoints:
    - path: /stats/prometheus
      port: http-envoy-prom
      interval: 30s
---
# istiod's own control-plane metrics (config push latency, xDS connections, cert
# issuance) -- separate from the sidecar/data-plane metrics above. Uses a
# ServiceMonitor (not PodMonitor) because istiod has one stable Service with a
# dedicated, named port for exactly this (http-monitoring -> 15014, confirmed via
# `kubectl get svc istiod -n istio-system -o jsonpath='{.spec.ports}'`), unlike the
# per-sidecar case above which has no equivalent Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: istio-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      istio: pilot
  endpoints:
    - port: http-monitoring
      path: /metrics
      interval: 30s
